<h2 mat-dialog-title>{{ isEditMode ? '编辑' : '添加' }}证书信息</h2>

<mat-dialog-content>
  <form [formGroup]="certificationForm" class="certification-form">
    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>证书名称 *</mat-label>
        <mat-select formControlName="name">
          <mat-option *ngFor="let cert of commonCertifications" [value]="cert">
            {{ cert }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="certificationForm.get('name')?.invalid && certificationForm.get('name')?.touched">
          {{ getErrorMessage('name') }}
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row" *ngIf="certificationForm.get('name')?.value === '其他'">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>自定义证书名称 *</mat-label>
        <input matInput placeholder="请输入证书名称">
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>颁发机构 *</mat-label>
        <input matInput formControlName="issuer" placeholder="请输入颁发机构名称">
        <mat-error *ngIf="certificationForm.get('issuer')?.invalid && certificationForm.get('issuer')?.touched">
          {{ getErrorMessage('issuer') }}
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>颁发日期 *</mat-label>
        <input matInput [matDatepicker]="issuePicker" formControlName="issueDate" placeholder="选择颁发日期">
        <mat-datepicker-toggle matSuffix [for]="issuePicker"></mat-datepicker-toggle>
        <mat-datepicker #issuePicker></mat-datepicker>
        <mat-error *ngIf="certificationForm.get('issueDate')?.invalid && certificationForm.get('issueDate')?.touched">
          {{ getErrorMessage('issueDate') }}
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-checkbox [(ngModel)]="hasExpiryDate" (change)="onHasExpiryDateChange()" [ngModelOptions]="{standalone: true}">
        证书有有效期限制
      </mat-checkbox>
    </div>

    <div class="form-row" *ngIf="hasExpiryDate">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>有效期</mat-label>
        <input matInput [matDatepicker]="expiryPicker" formControlName="expiryDate" placeholder="选择有效期">
        <mat-datepicker-toggle matSuffix [for]="expiryPicker"></mat-datepicker-toggle>
        <mat-datepicker #expiryPicker></mat-datepicker>
        <mat-error *ngIf="certificationForm.get('expiryDate')?.invalid && certificationForm.get('expiryDate')?.touched">
          {{ getErrorMessage('expiryDate') }}
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>证书编号</mat-label>
        <input matInput formControlName="certificateNumber" placeholder="请输入证书编号（可选）">
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>备注</mat-label>
        <textarea matInput formControlName="remarks" rows="3" placeholder="请输入备注信息（可选）"></textarea>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">取消</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="certificationForm.invalid">
    {{ isEditMode ? '更新' : '保存' }}
  </button>
</mat-dialog-actions>
