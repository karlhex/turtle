<div class="pending-approvals">
  <!-- 页面头部 -->
  <div class="header">
    <div class="title-section">
      <h2>我的待办审批</h2>
      <p>处理分配给我的入职申请审批任务</p>
    </div>
    <div class="action-section">
      <button mat-icon-button (click)="refresh()" [disabled]="loading" class="refresh-btn">
        <mat-icon [class.spinning]="loading">refresh</mat-icon>
      </button>
    </div>
  </div>

  <!-- 筛选和搜索 -->
  <div class="filters">
    <mat-form-field class="search-field">
      <mat-label>搜索申请人</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="输入姓名或邮箱">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <!-- 待办任务表格 -->
  <div class="table-container">
    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>
    
    <table mat-table [dataSource]="dataSource" matSort class="pending-tasks-table mat-elevation-2">
      
      <!-- 申请编号列 -->
      <ng-container matColumnDef="applicationId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>申请编号</th>
        <td mat-cell *matCellDef="let task">
          <span class="application-id">#{{ task.applicationId }}</span>
        </td>
      </ng-container>

      <!-- 申请人姓名列 -->
      <ng-container matColumnDef="applicantName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>申请人</th>
        <td mat-cell *matCellDef="let task">
          <div class="applicant-info">
            <div class="name">{{ task.applicantName || '-' }}</div>
          </div>
        </td>
      </ng-container>

      <!-- 邮箱列 -->
      <ng-container matColumnDef="applicantEmail">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>邮箱</th>
        <td mat-cell *matCellDef="let task">
          {{ task.applicantEmail || '-' }}
        </td>
      </ng-container>

      <!-- 审批步骤列 -->
      <ng-container matColumnDef="stepType">
        <th mat-header-cell *matHeaderCellDef>审批步骤</th>
        <td mat-cell *matCellDef="let task">
          <span class="step-badge" [ngClass]="'step-' + task.stepType">
            {{ task.stepType }}
          </span>
        </td>
      </ng-container>

      <!-- 创建时间列 -->
      <ng-container matColumnDef="createTime">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>创建时间</th>
        <td mat-cell *matCellDef="let task">
          {{ formatDate(task.createTime) }}
        </td>
      </ng-container>

      <!-- 操作列 -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>操作</th>
        <td mat-cell *matCellDef="let task">
          <div class="action-buttons">
            <button mat-icon-button 
                    (click)="viewApplication(task)"
                    matTooltip="查看申请详情"
                    class="view-btn">
              <mat-icon>visibility</mat-icon>
            </button>
            
            <button mat-raised-button 
                    color="primary"
                    (click)="processApproval(task)"
                    matTooltip="处理审批"
                    class="process-btn">
              <mat-icon>task_alt</mat-icon>
              处理审批
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="task-row"></tr>
    </table>

    <!-- 分页器 -->
    <mat-paginator [pageSizeOptions]="[10, 20, 50]" 
                   [showFirstLastButtons]="true"
                   class="table-paginator">
    </mat-paginator>

    <!-- 空状态 -->
    <div *ngIf="!loading && dataSource.data.length === 0" class="empty-state">
      <mat-icon class="empty-icon">inbox</mat-icon>
      <h3>暂无待办任务</h3>
      <p>当前没有需要您处理的审批任务</p>
    </div>
  </div>
</div>
